{% extends "base_layout.html" %}

{% block title %}NOVA | Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-4">
        <h1 class="mb-4 display-6 display-md-4 fw-bold text-center text-uppercase nova-ls-1">Вход</h1>
        <form class="d-grid gap-3" action="{% url 'accounts:login' %}" method="post">
            {% csrf_token %}
            <div class="form-fields">
                {{ form }}
            </div>
            {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
            <div class="row row-gap-3 justify-content-center">
                <div class="col-md-auto">
                    <button class="btn btn-primary w-100 w-md-auto" type="submit">
                        Войти
                    </button>
                </div>
            </div>
        </form>
        <p class="text-center mt-4 small text-muted">
            Нет аккаунта? <a class="text-primary text-decoration-none" href="{% url 'accounts:signup' %}">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock content %}
