{% extends "base_layout.html" %}
{% load static %}

{% block title %}NOVA | {{ title }}{% endblock %}

{% block content %}

<h1 class="mb-4 display-6 display-md-4 fw-bold text-uppercase nova-ls-1">{{ title }}</h1>

<div class="mb-4 d-flex flex-column flex-sm-row justify-content-sm-between align-items-sm-center gap-3">
    <div class="btn-group">
        <a class="btn btn-outline-primary px-3 {% if type == 'drivers' %}active{% endif %}" 
           href="?type=drivers&season_year={{ season_year }}">
            Пилоты
        </a>
        <a class="btn btn-outline-primary px-3 {% if type == 'teams' %}active{% endif %}"
           href="?type=teams&season_year={{ season_year }}">
            Команды
        </a>
    </div>
    <form method="get">
        <input type="hidden" name="type" value="{{ standings_type }}">
        <div class="input-group rounded">
            <select class="form-select text-center" name="season_year">
                {% for y in years_range %}
                    <option value="{{ y }}" {% if y == season_year %}selected{% endif %}>{{ y }}</option>
                {% empty %}
                    <option value="{{ season_year }}">{{ season_year }}</option>
                {% endfor %}
            </select>
            <button class="btn btn-primary" type="submit">
                Показать
            </button>
        </div>
    </form>
</div>

<!-- Контейнер для графика -->
<div class="bg-white p-3 border rounded shadow-sm mt-4">
    <canvas id="analysisChart" width="400" height="180"></canvas>
</div>

<!-- Скрытые JSON данные от Django -->
{{ chart_labels|json_script:"chart-labels-data" }}
{{ chart_data|json_script:"chart-values-data" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const labelsData = JSON.parse(document.getElementById('chart-labels-data').textContent);
    const valuesData = JSON.parse(document.getElementById('chart-values-data').textContent);
    const standingsType = "{{ standings_type }}";

    const ctx = document.getElementById('analysisChart').getContext('2d');
    
    const barColor = 'rgba(13, 110, 253, 0.7)';
    const borderColor = 'rgba(13, 110, 253, 1)';

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labelsData,
            datasets: [{
                label: standingsType === 'drivers' ? 'Очки пилота за сезон' : 'Очки команды за сезон',
                data: valuesData,
                backgroundColor: barColor,
                borderColor: borderColor,
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Очки'
                    }
                }
            }
        }
    });
</script>
{% endblock %}
