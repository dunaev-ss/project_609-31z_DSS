{% extends "base_layout.html" %}
{% load static %}

{% block title %}NOVA | {{ title }}{% endblock %}

{% block content %}

<h1 class="mb-4 display-6 display-md-4 fw-bold text-uppercase nova-ls-1">{{ title }}</h1>

<div class="mb-4 d-flex flex-column flex-sm-row justify-content-sm-between align-items-sm-center gap-3">
    <div class="btn-group">
        <a class="btn btn-outline-primary px-3 {% if standings_type == 'drivers' %}active{% endif %}" 
           href="?type=drivers&season_year={{ season_year }}">
            Пилоты
        </a>
        <a class="btn btn-outline-primary px-3 {% if standings_type == 'teams' %}active{% endif %}"
           href="?type=teams&season_year={{ season_year }}">
            Команды
        </a>
    </div>
    <form method="get">
        <input type="hidden" name="type" value="{{ standings_type }}">
        <div class="input-group rounded">
            <select class="form-select text-center" name="season_year">
                {% for y in years_range %}
                    <option value="{{ y }}" {% if y == season_year %}selected{% endif %}>{{ y }}</option>
                {% empty %}
                    <option value="{{ season_year }}">{{ season_year }}</option>
                {% endfor %}
            </select>
            <button class="btn btn-primary" type="submit">
                Показать
            </button>
        </div>
    </form>
</div>

<div class="bg-light p-3 border rounded mt-4">
    <canvas id="analysisChart"></canvas>
</div>

<!-- Скрытые JSON данные от Django -->
{{ chart_labels|json_script:"chart-labels-data" }}
{{ chart_data|json_script:"chart-values-data" }}

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>

<script>
    const labelsData = JSON.parse(document.getElementById('chart-labels-data').textContent);
    const valuesData = JSON.parse(document.getElementById('chart-values-data').textContent);
    const standingsType = "{{ standings_type }}";

    const ctx = document.getElementById('analysisChart').getContext('2d');

    Chart.register(ChartDataLabels);
 
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labelsData,
            datasets: [{
                data: valuesData,
                borderRadius: 8,
            }]
        },
        options: {
            responsive: true,
            layout: {
                padding: {
                    top: 24 
                }
            },
            plugins: {
                legend: {
                    display: false,
                },
                tooltip: {
                    displayColors: false,
                    bodyFont: {
                        weight: 'bold',
                    },
                    callbacks: {
                        title: function(){
                            return '';
                        },
                        label: function(context) {
                            const label = context.label || '';
                            const value = context.parsed.y;
                            return `${label}: ${value}`;
                        }
                    }
                },
                datalabels: {
                    anchor: 'end',
                    align: 'top',
                    font: {
                        weight: 'bold'
                    },
                    formatter: function(value) {
                        return value > 0 ? value : '';
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Количество очков'
                    }
                }
            }
        }
    });
</script>
{% endblock %}
